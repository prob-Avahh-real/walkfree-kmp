name: WalkFree CI/CD v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run all tests
        run: ./gradlew :shared:allTests

  android-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release APK
        run: ./gradlew :composeApp:assembleRelease
      - name: Check APK size
        run: |
          SIZE=$(stat -c%s composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk 2>/dev/null || echo 0)
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt 50000000 ]; then echo "⚠️ APK exceeds 50MB"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: walkfree-android
          path: composeApp/build/outputs/apk/release/*.apk

  ios-build:
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
